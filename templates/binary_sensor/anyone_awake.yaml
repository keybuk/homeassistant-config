# Binary sensor that tracks whether anyone is home and awake.
- binary_sensor:
    name: Anyone Awake
    unique_id: anyone_awake
    device_class: "occupancy"
    state: |
      {{ 'on' if is_state('binary_sensor.anyone_home', 'on')
         and is_state('binary_sensor.everyone_asleep', 'off') else 'off' }}
    attributes:
      entity_id: |
        {{ [  'binary_sensor.anyone_home',
              'binary_sensor.everyone_asleep' ] }}
