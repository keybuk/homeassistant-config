# Occupancy sensors for rooms that combine occupancy with weather conditions
# and privacy latches to determine whether lights in a room should be on.
- use_blueprint:
    path: aziz.yaml
    input:
      occupancy: binary_sensor.bedroom_astir
      latch: input_boolean.bedroom_privacy
  name: Aziz
  unique_id: bedroom_aziz

- use_blueprint:
    path: aziz.yaml
    input:
      occupancy: binary_sensor.home_astir
      latch: input_boolean.dining_room_privacy
  name: Aziz
  unique_id: dining_room_aziz

