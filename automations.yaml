- id: '1783216934492'
  alias: 'Off'
  description: Turn things off when the last person goes to sleep, or the home is
    no longer occupied.
  triggers:
  - trigger: state
    entity_id: binary_sensor.anyone_home
    to: 'off'
  - trigger: state
    entity_id: binary_sensor.anyone_asleep
    to: 'on'
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.anyone_home
      state:
      - 'off'
    - condition: state
      entity_id: binary_sensor.anyone_asleep
      state:
      - 'on'
  actions:
  - action: light.turn_off
    continue_on_error: true
    target:
      area_id: bathroom
  - action: media_player.media_pause
    continue_on_error: true
    target:
      entity_id: media_player.bathroom_sonos
    data: {}
  mode: single
- id: '1783217502651'
  alias: Lights
  description: 'Turns on the kitchen counter lights for 15 minutes after motion is
    detected, or when anyone comes home at night.

    '
  triggers:
  - note: Trigger using the Eve Motion, as it's the most reliable.
    trigger: state
    entity_id:
    - binary_sensor.dining_room_eve_motion_occupancy
    to:
    - 'on'
  - trigger: state
    entity_id: binary_sensor.anyone_home
    to: 'on'
    not_from: unavailable
    note: Trigger when the first person arrives home.
  - trigger: zone
    entity_id:
    - person.scotty
    zone: zone.home
    event: enter
    note: Trigger when known people arrive home, even if the home is otherwise already
      occupied.
  conditions:
  - condition: state
    entity_id: sensor.weather
    state:
    - night
    - cloudy-day
    note: Only turn lights on at night or during a cloudy day.
  - note: "Only trigger when the kitchen counter light is off, unless an instance
      of this automation is running in which case we restart the timer.           \n"
    condition: or
    conditions:
    - condition: state
      entity_id: light.kitchen_counter
      state:
      - 'off'
    - condition: state
      entity_id: automation.kitchen_lights
      state:
      - 1
      attribute: current
  - condition: state
    entity_id: binary_sensor.anyone_home
    state: 'on'
    note: Only when someone is home.
  actions:
  - note: Turn lights on at 25% brightness, unless already on.
    if:
    - condition: state
      entity_id: light.kitchen_counter
      state: 'off'
    then:
    - action: light.turn_on
      data:
        brightness_pct: 25
      target:
        entity_id: light.kitchen_counter
    - delay:
        seconds: 3
      note: Assume it takes a few seconds, avoid triggering our own wait condition.
  - wait_for_trigger:
    - trigger: state
      entity_id: light.kitchen_counter
    timeout:
      minutes: 15
    note: "Keep the light on for 15 minutes.                                          \nBut
      if the kitchen counter state changes, assume we should leave it alone and not
      turn it off in the middle of someone's burrito.                    \n"
  - if:
    - condition: template
      value_template: '{{ not wait.completed }}'
    then:
    - action: light.turn_off
      target:
        entity_id: light.kitchen_counter
  mode: restart
- id: '1783369377035'
  alias: Blackout
  description: Close the bedroom blackout blinds when we're sleeping in, and open
    when we wake up.
  triggers:
  - trigger: state
    entity_id: binary_sensor.anyone_asleep
    to:
    - 'on'
    - 'off'
  - trigger: state
    entity_id: binary_sensor.bedroom_window
    to: 'off'
    for:
      seconds: 3
  - trigger: state
    entity_id: input_boolean.bedroom_privacy
    to:
    - 'on'
    - 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.anyone_asleep
        state: 'off'
      - condition: state
        entity_id: input_boolean.bedroom_privacy
        state: 'off'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.bedroom_blackout_open
    - conditions:
      - condition: sun
        before: sunset
        after: sunrise
        after_offset: -03:00:00
      - condition: state
        entity_id: binary_sensor.anyone_asleep
        state: 'on'
      - condition: state
        entity_id: binary_sensor.bedroom_window
        state: 'off'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.bedroom_blackout_close
  mode: queued
